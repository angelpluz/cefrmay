<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phetchabun Adventure Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #020617 0%, #111827 100%);
        color: #f8fafc;
        font-family: system-ui, sans-serif;
      }

      .card {
        width: min(360px, calc(100vw - 32px));
        border-radius: 28px;
        padding: 24px;
        background: rgba(255, 255, 255, 0.08);
        text-align: center;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.4);
        backdrop-filter: blur(18px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Offline</h1>
      <p>Phetchabun Adventure is unavailable right now. Reconnect and reopen the app.</p>
    </div>
  </body>
  </html>
